<div class="page"><div class="wrap">

  <header>
    <div class="brand">breathe<i>.</i></div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-techniques" aria-selected="true" data-click="show('techniques')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>Techniques</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-click="show('progress')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
  </nav>

  <section id="view-techniques"></section>
  <section id="view-progress" class="hide"></section>

</div>

<input type="file" id="restoreFile" accept="application/json,.json" hidden data-change="restoreBackup(this)">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ PACER ============ -->
<div id="pacer" role="dialog" aria-modal="true" aria-label="Breathing pacer">
  <div class="pacer-title" id="pacerName"></div>
  <div class="ring-wrap">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <g transform="rotate(-90 130 130)">
        <circle class="disc" id="disc" cx="130" cy="130" r="30"></circle>
        <circle class="disc-line" id="discLine" cx="130" cy="130" r="30"></circle>
        <g id="segs"></g>
        <g id="markerG"><circle class="marker" cx="130" cy="26" r="5"></circle></g>
      </g>
    </svg>
    <div class="centre">
      <div class="phase" id="phaseLabel">Ready</div>
      <div class="count" id="phaseCount">–</div>
      <div class="side" id="phaseSide"></div>
    </div>
  </div>
  <div id="pacerPrompt"></div>
  <div class="meta" id="pacerMeta"></div>
  <div class="row" style="justify-content:center">
    <button class="btn ghost" id="pacerAction">Pause</button>
    <button class="btn quiet" data-click="endSession(false)">Finish</button>
  </div>
</div>
</div>
